# Runs the standalone RSpec suite (spec/dummy host app, in-memory sqlite)
# across the supported Ruby versions, and verifies the gem packages cleanly.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rspec:
    name: RSpec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The gem supports Ruby >= 3.1, but the test suite's dummy app runs on
        # Rails 8.1, which needs Ruby >= 3.2.
        ruby: [ '3.2', '3.3', '3.4' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run the test suite
        run: bundle exec rspec

  build:
    name: Gem build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Build the gem
        run: gem build activeadmin_configurable_columns.gemspec
